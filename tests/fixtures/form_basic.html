<!doctype html><html><body>
<h1>Software Engineer</h1>
<form id="f" onsubmit="document.title='SUBMITTED'; return false;">
  <label for="fn">First Name *</label><input id="fn" name="first_name" required>
  <label for="ln">Last Name *</label><input id="ln" name="last_name" required>
  <label for="em">Email *</label><input id="em" name="email" type="email" required>
  <label for="ph">Phone *</label><input id="ph" name="phone" type="tel" required>
  <label for="li">LinkedIn Profile</label><input id="li" name="li">
  <label for="rs">Resume/CV *</label><input id="rs" name="resume" type="file" required>
  <label for="deg">Degree *</label>
  <select id="deg" name="degree" required><option value="">Select...</option><option>High School</option><option>Bachelor's Degree</option><option>Master's</option></select>
  <label for="src">How did you hear about us?</label>
  <select id="src" name="src"><option value="">Please select</option><option>LinkedIn</option><option>Company careers page</option><option>Friend</option></select>
  <fieldset><legend>Are you legally authorized to work in India? *</legend>
    <label><input type="radio" name="auth" value="y"> Yes</label>
    <label><input type="radio" name="auth" value="n"> No</label></fieldset>
  <fieldset><legend>Will you now or in the future require visa sponsorship? *</legend>
    <label><input type="radio" name="spons" value="y"> Yes</label>
    <label><input type="radio" name="spons" value="n"> No</label></fieldset>
  <label for="g">Gender</label>
  <select id="g" name="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Decline to self identify</option></select>
  <label for="ctc">Current CTC *</label><input id="ctc" name="ctc" required>
  <label for="why">Why do you want to work here? *</label><textarea id="why" name="why" required></textarea>
  <label><input type="checkbox" name="consent" required> I agree to the privacy policy and terms *</label>
  <button type="submit">Submit Application</button>
</form></body></html>
