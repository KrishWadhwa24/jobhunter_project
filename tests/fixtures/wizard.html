<!doctype html><html><body>
<div id="s1"><h2>Step 1</h2>
<label for="fn">Full name *</label><input id="fn" name="name" required>
<label for="em">Email *</label><input id="em" name="email" required>
<label for="ph">Phone *</label><input id="ph" name="phone" required>
<button type="button" id="next" onclick="document.getElementById('s1').style.display='none';document.getElementById('s2').style.display='block'">Next</button></div>
<div id="s2" style="display:none"><h2>Step 2</h2>
<label for="sc">College / University *</label><input id="sc" name="school" required>
<label for="li">LinkedIn *</label><input id="li" name="linkedin" required>
<label for="x">Do you have a pet? *</label><input id="x" name="pet" required></div>
</body></html>
