# Optional: a dedicated Postgres + Redis for this project (only needed if you do NOT want to reuse your existing containers).
# Ports are bound to localhost only. Data lives in Docker volumes, not in this folder.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter_local
      POSTGRES_DB: jobhunter
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["jobhunter_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:56379:6379"]
volumes:
  jobhunter_pg:
# Then in .env:
#   DATABASE_URL=postgresql://jobhunter:jobhunter_local@127.0.0.1:55432/jobhunter
#   REDIS_URL=redis://127.0.0.1:56379/0
